apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-agent-service
  namespace: coding-agent
  labels:
    app: coding-agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coding-agent-service
  template:
    metadata:
      labels:
        app: coding-agent-service
    spec:
      containers:
        - name: coding-agent-service
          image: coding-agent-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args:
            - coding_agent_service.server:app
            - --app-dir
            - /app/src
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          envFrom:
            - configMapRef:
                name: coding-agent-service-config
            - secretRef:
                name: coding-agent-service-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: claude-home
              mountPath: /var/service/coding-agent-service/share/.claude
              readOnly: true
            - name: claude-home
              mountPath: /var/service/coding-agent-service/share/projects
      volumes:
        - name: claude-home
          persistentVolumeClaim:
            claimName: coding-agent-service-pvc
