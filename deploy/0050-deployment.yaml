apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-agent-service
  namespace: coding-agent
  labels:
    app: coding-agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coding-agent-service
  template:
    metadata:
      labels:
        app: coding-agent-service
    spec:
      containers:
        - name: coding-agent-service
          image: lingxi.image.io/kunpeng/agent/coding-agent/coding-agent-service:v0.114
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          command: ["python", "-m", "uvicorn"]
          args:
            - coding_agent_service.server:app
            - --app-dir
            - /app/src
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          envFrom:
            - configMapRef:
                name: coding-agent-service-config
            - secretRef:
                name: coding-agent-service-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: claude-home
              mountPath: /var/service/coding-agent-service
        - name: codex-log-collector
          image: lingxi.image.io/kunpeng/agent/coding-agent/codex-log-collector:v0.119
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEX_HOME
              value: /var/service/coding-agent-service/share/.codex
            - name: CODEX_LOG_MIN_LEVEL
              value: INFO
            - name: CODEX_LOG_POLL_SECONDS
              value: "1"
            - name: CODEX_LOG_START_POSITION
              value: beginning
          volumeMounts:
            - name: claude-home
              mountPath: /var/service/coding-agent-service
              readOnly: true
      volumes:
        - name: claude-home
          persistentVolumeClaim:
            claimName: coding-agent-service-pvc
