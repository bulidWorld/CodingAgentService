apiVersion: v1
kind: ConfigMap
metadata:
  name: coding-agent-service-config
  namespace: coding-agent
data:
  SERVICE_NAME: coding-agent-service
  PORT: "8000"
  # Set this when using an Anthropic-compatible gateway; omit it for Anthropic's default endpoint.
  ANTHROPIC_BASE_URL: http://192.168.100.133:8788
  PUBLIC_BASE_URL: https://192.168.100.133
  CLAUDE_MAX_TURNS: "30"
  ANTHROPIC_MODEL: gpt-6-luna
  ANTHROPIC_DEFAULT_OPUS_MODEL: gpt-6-luna
  ANTHROPIC_DEFAULT_SONNET_MODEL: gpt-6-luna
  ANTHROPIC_DEFAULT_HAIKU_MODEL: gpt-6-luna
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  CLAUDE_CODE_EFFORT_LEVEL: medium
